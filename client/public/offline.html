<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a2e0f" />
    <title>Custodia: bez pripojenia</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #e7ede5;
        color: #0a2e0f;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { font-size: 1.3rem; margin: 16px 0 8px; }
      p { margin: 0 0 20px; color: #536553; }
      button { border: 0; border-radius: 14px; padding: 12px 22px; background: #28861c; color: #fff; font-weight: 700; font-size: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <img src="/app-icons/icon-192.png" alt="Custodia" />
      <h1>Ste bez pripojenia</h1>
      <p>Custodia potrebuje internet. Skontrolujte Wi-Fi alebo mobilné dáta.</p>
      <button type="button" onclick="location.reload()">Skúsiť znova</button>
    </main>
  </body>
</html>
